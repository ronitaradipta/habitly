<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="80" fill="#F5F5F5"/>

  <!-- Calendar outline -->
  <rect x="60" y="60" width="80" height="70" rx="4" fill="white" stroke="#BDBDBD" stroke-width="2"/>

  <!-- Calendar header -->
  <rect x="60" y="60" width="80" height="20" rx="4" fill="#E0E0E0"/>
  <rect x="60" y="75" width="80" height="5" fill="#E0E0E0"/>

  <!-- Calendar binding rings -->
  <circle cx="75" cy="65" r="3" fill="#9E9E9E"/>
  <circle cx="100" cy="65" r="3" fill="#9E9E9E"/>
  <circle cx="125" cy="65" r="3" fill="#9E9E9E"/>

  <!-- Empty checkbox row 1 -->
  <rect x="70" y="95" width="12" height="12" rx="2" fill="none" stroke="#BDBDBD" stroke-width="1.5"/>
  <line x1="88" y1="101" x2="125" y2="101" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round"/>

  <!-- Empty checkbox row 2 -->
  <rect x="70" y="112" width="12" height="12" rx="2" fill="none" stroke="#BDBDBD" stroke-width="1.5"/>
  <line x1="88" y1="118" x2="115" y2="118" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round"/>

  <!-- Small decorative element - checkmark in corner -->
  <path d="M 150 140 Q 160 150 170 130" stroke="#E0E0E0" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
